<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Starbots Hybrid Infrastructure</title>
  <desc id="desc">Three infrastructure alternatives converge toward an evidence-backed decision on a dark violet canvas.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#111024"/>
      <stop offset="1" stop-color="#211541"/>
    </linearGradient>
    <linearGradient id="route" x2="1">
      <stop stop-color="#7657F5"/>
      <stop offset="1" stop-color="#E2D5FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#surface)"/>
  <g fill="none" stroke="#8B72DF" opacity=".25">
    <path d="M745 52h405M745 248h405"/>
    <path d="M792 46v208M1090 46v208"/>
  </g>
  <g fill="none" stroke="url(#route)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M758 86h115l78 64h183"/>
    <path d="M758 150h376"/>
    <path d="M758 214h115l78-64"/>
  </g>
  <g fill="#E8DEFF" stroke="#211541" stroke-width="6">
    <circle cx="758" cy="86" r="10"/><circle cx="758" cy="150" r="10"/><circle cx="758" cy="214" r="10"/>
    <circle cx="951" cy="150" r="16"/><circle cx="1134" cy="150" r="10"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#FFFFFF">
    <text x="48" y="64" font-size="16" font-weight="700" letter-spacing="3" fill="#BEA8FF">STARBOTS / INFRASTRUCTURE</text>
    <text x="46" y="128" font-size="47" font-weight="700">Hybrid Infrastructure</text>
    <text x="48" y="168" font-size="20" fill="#DFD8EF">Compare options. Trace costs. Explain the decision.</text>
    <text x="48" y="269" font-size="14" letter-spacing="1" fill="#C8BBE7">CAPACITY   /   FINOPS   /   RESILIENCE   /   IMPLEMENTATION</text>
  </g>
</svg>
