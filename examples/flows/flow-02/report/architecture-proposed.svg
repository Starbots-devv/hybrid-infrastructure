<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 655" role="img" aria-label="current architecture"><title>current — declared architecture</title><defs><marker id="arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7658ac"/></marker></defs><rect width="740" height="655" fill="#f6f4fa" rx="12"/><text x="25" y="35" font-family="sans-serif" font-size="20" fill="#211635">current / SYNTHETIC MODEL</text><text x="25" y="62" font-family="sans-serif" font-size="12" fill="#554764">Arrows identify declared dependencies. Connectivity and resilience are unverified.</text><path d="M 345 155 L 395 155" stroke="#7658ac" stroke-width="2" fill="none" marker-end="url(#arrow-current)"><title>worker-db</title></path><rect x="25" y="100" width="320" height="110" rx="9" fill="white" stroke="#c9bedb"/><text x="40" y="125" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4e2b7d">compute</text><text x="40" y="149" font-family="sans-serif" font-size="12" fill="#30283b">Managed SaaS/API compute</text><rect x="395" y="100" width="320" height="110" rx="9" fill="white" stroke="#c9bedb"/><text x="410" y="125" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4e2b7d">db</text><text x="410" y="149" font-family="sans-serif" font-size="12" fill="#30283b">Managed database</text><rect x="25" y="255" width="320" height="110" rx="9" fill="white" stroke="#c9bedb"/><text x="40" y="280" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4e2b7d">network</text><text x="40" y="304" font-family="sans-serif" font-size="12" fill="#30283b">Network</text><rect x="395" y="255" width="320" height="110" rx="9" fill="white" stroke="#c9bedb"/><text x="410" y="280" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4e2b7d">observability</text><text x="410" y="304" font-family="sans-serif" font-size="12" fill="#30283b">Monitoring and security</text><rect x="25" y="410" width="320" height="110" rx="9" fill="white" stroke="#c9bedb"/><text x="40" y="435" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4e2b7d">operations</text><text x="40" y="459" font-family="sans-serif" font-size="12" fill="#30283b">Operations labor</text><text x="25" y="590" font-family="sans-serif" font-size="11" fill="#554764">Unconnected boxes are accounting resources; only declared connections have arrows.</text><text x="25" y="617" font-family="sans-serif" font-size="12" fill="#30283b">worker-db: compute → db / PostgreSQL over TLS:5432</text></svg>